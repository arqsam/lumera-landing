name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (según package-lock.json)
        run: npm ci

      - name: Tests (CS-03)
        run: npm test

      - name: Type-check y build (CS-02)
        run: npm run build
